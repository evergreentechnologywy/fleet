name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all

      # The binary must actually run, not merely compile: `paths` and a bare
      # invocation are the two surfaces every user touches first.
      - name: smoke
        run: |
          cargo build --release
          export FLEET_HOME="$(mktemp -d)"
          ./target/release/fleet paths
          ./target/release/fleet
          ./target/release/fleet harness list

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
          - triple: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2

      - name: install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "fleet-${{ matrix.triple }}.tar.gz" fleet
          mv "fleet-${{ matrix.triple }}.tar.gz" "$GITHUB_WORKSPACE/"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fleet-${{ matrix.triple }}.tar.gz
            install.sh
          generate_release_notes: true
