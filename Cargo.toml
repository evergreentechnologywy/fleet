[package]
name = "fleet"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A harness for harnesses: one orchestrator that routes a task across many agent CLIs, each choosing its own harness and model per call based on their strengths."
license = "MIT"
repository = "https://github.com/evergreentechnologywy/fleet"
readme = "README.md"
keywords = ["orchestrator", "agents", "harness", "llm", "router"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tiny_http = "0.12"
toml = "0.8"
ureq = { version = "2.10", features = ["json"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
