# Providers are fleet-wide: declare once, every harness can use it.
# A key is always named, never written, so this file stays publishable.
#
# [[provider]]
# name = "myprovider"
# base_url = "https://api.myprovider.ai/v1"
# key_env = "MYPROVIDER_API_KEY"
# models = ["*"]
# # Harnesses that must never receive it:
# block = []

[[provider]]
name = "chooser"
base_url = "http://127.0.0.1:8792/v1"
key_env = "TB_API_KEY"
models = ["*"]
block = []
enabled = true
notes = "the Jev chooser's OpenAI door; same authorized models, fleet-decided"

[provider.extra]

[[provider]]
name = "step-plan"
base_url = "https://api.stepfun.ai/step_plan/v1"
key_env = "STEP_API_KEY"
models = ["*"]
block = []
enabled = true
notes = "Step subscription models and media"

[provider.extra]

[[provider]]
name = "liquid"
base_url = "https://api.liquid.ai/v1"
key_env = "LIQUID_API_KEY"
models = ["*"]
block = []
enabled = true
notes = "same-model failover and cost comparison lane"

[provider.extra]

[[provider]]
name = "muse"
base_url = "http://127.0.0.1:8792/v1"
key_env = ""
models = ["*"]
block = []
enabled = true
notes = "OAuth via the omp broker; routed through the chooser door"

[provider.credential]
kind = "oauth"
broker = "omp"
args = []
provider = "muse-code"
force_refresh = false
ttl_s = 300
json_field = "oauthAccessToken"

[provider.extra]

