# The fleet's provider set. A key is always an env var NAME or a broker command,
# never a value: this file is safe to hold in git.

[[provider]]
name = "tokenbroker"
base_url = "https://api.thetokenbroker.ai/v1"
key_env = "TB_API_KEY"
models = ["*"]
enabled = true
notes = "fleet main lane"

# An OAuth provider: the credential is a login managed by omp's broker, so there
# is no long-lived key to rotate. `fleet credential refresh` re-resolves it, and
# a rejected call re-resolves it automatically.
[[provider]]
name = "muse"
base_url = "https://api.muse.example/v1"
key_env = ""
models = ["*"]
enabled = true
notes = "OAuth via the omp broker"

[provider.credential]
kind = "oauth"
broker = "omp"
provider = "muse-code"
ttl_s = 300
json_field = "oauthAccessToken"
