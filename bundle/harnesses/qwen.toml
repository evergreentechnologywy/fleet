name = "qwen"
description = "Qwen Code: bulk edits and mechanical rewrites; talks to the chooser's OpenAI door"
kind = "cli"
# The CLI keeps its OWN configured model; an injected id fails it
# (measured: opencode works bare, errors with `--model jev/auto`).
# An empty model_flag is what makes the router pass nothing.
command = "qwen"
# Qwen Code needs an explicit auth type in non-interactive mode, and it reads
# the endpoint from OPENAI_BASE_URL, which the engine exports (the chooser's
# OpenAI door). Without --auth-type it exits 1 with "No auth type is selected".
model_flag = ["-m", "{model}"]
# qwen IGNORES OPENAI_BASE_URL (measured 2026-10-27: it went straight to
# dashscope.aliyuncs.com with a tokenbroker key and got "401 Incorrect API key").
# It has explicit flags for a custom endpoint, which is the only reliable way to
# point it at the fleet's door.
args = ["--auth-type", "openai", "--openai-base-url", "http://127.0.0.1:8792/v1", "-p", "{prompt}"]
prompt_on_stdin = false
route = "jev"
# This harness reaches the fleet through the chooser's OpenAI door, and the
# door is a CHOOSER: you ask for `jev/auto` and it resolves an authorized
# model itself. Declaring the catalogue here would be wrong twice over — the
# door advertises router ids it then refuses, and the router CLAMPS the
# chooser's answer to this list, so the list is the alias, not the models.
# The DOOR-SERVED models this CLI may be given. Not the alias `jev/auto`:
# a CLI receives a model id on its own command line and cannot resolve the
# door's routing alias (measured: "Unknown model: jev/auto", and qwen falls
# back to its own default which the door also does not serve).
models = ["deepseek-v4.1-flash", "glm-5.3-flash", "gpt-oss-120b", "mimo-v2.6-flash"]
effort = "medium"
tags = ["code", "bulk", "edit", "rewrite", "cheap"]
priority = 66
cost_hint = 0.01
enabled = true
timeout_s = 1800
