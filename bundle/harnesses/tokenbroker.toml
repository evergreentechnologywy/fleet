name = "tokenbroker"
description = "Direct tokenbroker endpoint; model chosen by the chooser per call"
kind = "openai-compat"
api_key_env = "TB_API_KEY"
route = "jev"
# Clamped to ids this key can actually use. `*` let the chooser hand it
# `muse-spark-1.3-contributor`, which tokenbroker answers with HTTP 403
# 'This key cannot use that model' (measured 2026-10-27).
models = ["deepseek-v4.1-flash", "gemini-3.8-flash", "glm-5.3-flash", "gpt-6-luna", "qwen3.8-flash", "hy4-preview", "step-5-preview"]
effort = "medium"
tags = ["chat", "fast", "text"]
priority = 40
cost_hint = 0.001
enabled = true
timeout_s = 180

[http]
base_url = "https://api.thetokenbroker.ai/v1"
chat_path = "/v1/chat/completions"
auth_header = "Authorization"
auth_scheme = "Bearer"
