name = "zeroclaw"
description = "ZeroClaw: smallest agent runtime; one-shot agent turns with its own provider set"
kind = "cli"
command = "zeroclaw"
# zeroclaw's custom provider reads its key from ZEROCLAW_API_KEY — found by
# trying the obvious names, because its error only says "Custom API key not set.
# Run `zeroclaw onboard` or set the appropriate env var" without naming it.
# `env:` values are read from the environment at call time, so the key is not
# written into this file.
args = ["agent", "-m", "{prompt}"]
env = { ZEROCLAW_API_KEY = "env:TB_API_KEY" }
prompt_on_stdin = false
route = "native"
# No model is injected: this CLI keeps its own configured default, and
# `jev/auto` is meaningless to it (measured: openclaw answers "Unknown model:
# jev/auto", codex reads it as stdin). An empty `model_flag` is what makes
# the router pass nothing.
# The DOOR-SERVED models this CLI may be given. Not the alias `jev/auto`:
# a CLI receives a model id on its own command line and cannot resolve the
# door's routing alias (measured: "Unknown model: jev/auto", and qwen falls
# back to its own default which the door also does not serve).
models = ["deepseek-v4.1-flash", "glm-5.3-flash", "gpt-oss-120b", "mimo-v2.6-flash"]
effort = "medium"
tags = ["chat", "agent", "small", "local"]
priority = 55
cost_hint = 0.02
enabled = true
timeout_s = 900
