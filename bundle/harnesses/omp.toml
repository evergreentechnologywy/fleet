name = "omp"
description = "omp coding agent: tools, PTY, skills, long autonomous runs"
kind = "cli"
command = "omp"
args = ["-p", "{prompt}"]
model_flag = ["--model", "{model}"]
effort_flag = ["--thinking", "{effort}"]
prompt_on_stdin = false
route = "jev"
models = ["*"]
effort = "high"
tags = ["code", "tools", "long", "repo"]
priority = 90
cost_hint = 0.05
enabled = true
timeout_s = 3600
