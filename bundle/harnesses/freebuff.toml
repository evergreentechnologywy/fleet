name = "freebuff"
description = "Freebuff: free coding agent CLI; installs its own binary on first run"
kind = "cli"
command = "freebuff"
# freebuff takes NO prompt argument — its only positional is the subcommand
# `login`, and passing text fails with "command-argument value ... is invalid".
# Measured 2026-10-27: it reads the prompt on STDIN and starts an interactive
# session, so `prompt_on_stdin = true` is the whole fix.

# VERIFIED 2026-10-27: `npm install -g freebuff` installs a launcher that
# DOWNLOADS a ~49 MB binary on first invocation. The first call therefore takes
# much longer than later ones, and a timeout on the first run is the download,
# not a hung agent. `login` is a subcommand, so the prompt is positional.
model_flag = ["-m", "{model}"]
prompt_on_stdin = true
route = "native"
# The DOOR-SERVED models this CLI may be given. Not the alias `jev/auto`:
# a CLI receives a model id on its own command line and cannot resolve the
# door's routing alias (measured: "Unknown model: jev/auto", and qwen falls
# back to its own default which the door also does not serve).
models = ["deepseek-v4.1-flash", "glm-5.3-flash", "gpt-oss-120b", "mimo-v2.6-flash"]
effort = "medium"
tags = ["code", "free", "agent"]
priority = 52
cost_hint = 0.0
enabled = false
timeout_s = 3600

# DISABLED 2026-10-27, measured: freebuff is an INTERACTIVE session, not a
# one-shot agent. It reads stdin and then stays open — a 200-second run
# produced no output and no exit. `prompt_on_stdin = true` gets the text in,
# but nothing tells it to finish, and its only positional is the `login`
# subcommand. Driving it would need a PTY plus a quit signal, which is a
# different integration than a descriptor can express.
