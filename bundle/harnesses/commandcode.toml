name = "commandcode"
description = "Command Code: coding agent that learns your codebase; -p is the non-interactive door"
kind = "cli"
command = "commandcode"

# VERIFIED 2026-10-27 from `commandcode --help`: `-p, --print [query]` runs in
# non-interactive mode, outputs the response, and exits. `-t/--trust` skips the
# first-run permission prompt, which would otherwise block a headless call.
args = ["-p", "{prompt}", "--trust"]
prompt_on_stdin = false
route = "jev"
# No model is injected: this CLI keeps its own configured default, and
# `jev/auto` is meaningless to it (measured: openclaw answers "Unknown model:
# jev/auto", codex reads it as stdin). An empty `model_flag` is what makes
# the router pass nothing.
# The DOOR-SERVED models this CLI may be given. Not the alias `jev/auto`:
# a CLI receives a model id on its own command line and cannot resolve the
# door's routing alias (measured: "Unknown model: jev/auto", and qwen falls
# back to its own default which the door also does not serve).
models = ["deepseek-v4.1-flash", "glm-5.3-flash", "gpt-oss-120b", "mimo-v2.6-flash"]
effort = "medium"
tags = ["code", "learn", "repo"]
priority = 70
cost_hint = 0.06
enabled = false
timeout_s = 3600

# NOTE: `command-code` and its keys are on the fleet's RETIRED provider list
# (owner 2026-09-24, rolled out). This descriptor is the CLI harness, which is a
# different thing from the retired PROVIDER lane; do not point it at that lane.

