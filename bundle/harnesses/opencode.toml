name = "opencode"
description = "opencode: multi-provider agent, good at bulk edits"
kind = "cli"
# The CLI keeps its OWN configured model; an injected id fails it
# (measured: opencode works bare, errors with `--model jev/auto`).
# An empty model_flag is what makes the router pass nothing.
command = "opencode"
args = ["run", "{prompt}"]
prompt_on_stdin = false
route = "jev"
# This harness reaches the fleet through the chooser's OpenAI door, and the
# door is a CHOOSER: you ask for `jev/auto` and it resolves an authorized
# model itself. Declaring the catalogue here would be wrong twice over — the
# door advertises router ids it then refuses, and the router CLAMPS the
# chooser's answer to this list, so the list is the alias, not the models.
# The text-lane model inventory (jev_fleet_policy.json). `"*"` made
# accepts() always true, so the router's ceiling clamped NOTHING and the
# chooser could hand this harness any id at all — including one no provider
# serves. Declaring the real set is what makes the ceiling mean something.
models = ["deepseek-v4.1-flash", "gemini-3.8-flash", "glm-5.3-flash", "gpt-6-luna", "muse-spark-1.3-contributor", "qwen3.8-flash", "hy4-preview", "step-5-preview"]
effort = "medium"
tags = ["code", "bulk", "multi-provider"]
priority = 70
cost_hint = 0.04
enabled = true
timeout_s = 1800
